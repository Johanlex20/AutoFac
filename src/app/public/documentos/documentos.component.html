<div class="min-h-screen bg-gray-50 px-6 py-10">
  <div class="mx-auto max-w-6xl">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Documentos</h1>
      <p class="text-sm text-gray-500">{{ documentos.length }} archivo(s) disponible(s)</p>
    </div>

    <div *ngIf="cargando" class="text-gray-500">Cargando documentos...</div>

    <div *ngIf="!cargando && documentos.length === 0" class="text-gray-500">
      Todavía no hay documentos disponibles.
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <div *ngFor="let doc of documentos"
           class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm transition hover:shadow-md">
        <div class="flex items-start justify-between">
          <span class="flex h-10 w-10 items-center justify-center rounded-lg text-xs font-semibold"
                [ngClass]="colorBadge(doc.nombreOriginal)">
            {{ extension(doc.nombreOriginal) }}
          </span>
          <span class="text-xs text-gray-400">{{ formatoTamano(doc.tamanoBytes) }}</span>
        </div>

        <p class="mt-3 truncate text-sm font-medium text-gray-800" [title]="doc.nombreOriginal">
          {{ doc.nombreOriginal }}
        </p>
        <p class="text-xs text-gray-400">{{ doc.fechaSubida | date: 'dd/MM/yyyy, h:mm a' }}</p>

        <a [href]="descargarUrl(doc)"
           class="mt-4 inline-flex items-center gap-1 text-sm font-medium text-indigo-600 hover:text-indigo-700">
          Descargar
        </a>
      </div>
    </div>
  </div>
</div>
